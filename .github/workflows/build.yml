name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip openjdk-17-jdk libgtk-3-dev libegl1-mesa-dev libgl1-mesa-dev
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Android APK
        run: |
          flet build apk --python-version 3.12 --verbose

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyberDesk-Game-APK
          path: build/apk/*.apk
          
